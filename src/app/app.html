<a class="skip-link" href="#lesson-content">Skip to lesson content</a>

<header class="app-header">
  <a class="brand" routerLink="/academy">
    <span aria-hidden="true">△</span>
    Angular Academy
  </a>

  <nav aria-label="Academy lessons">
    <a
      routerLink="/academy"
      routerLinkActive="active-link"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>
    @for (level of [1, 2, 3, 4, 5, 6, 7, 8]; track level) {
      <a
        [routerLink]="['/lesson', level]"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
      >
        L{{ level }}
      </a>
    }
  </nav>
</header>

<main id="lesson-content">
  <router-outlet (activate)="focusRouteHeading()" />
</main>
